<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 도구 모음 · 자리를 옮겼습니다</title>
<link rel="canonical" href="https://scienceisjo.github.io/growing-teachers/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://scienceisjo.github.io/growing-teachers/">
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#f2f0eb;color:rgba(0,0,0,.87);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    letter-spacing:-.01em;line-height:1.6;-webkit-font-smoothing:antialiased}
  .box{max-width:420px;text-align:center;background:#fff;border-radius:12px;padding:40px 32px;
    box-shadow:0 0 .5px 0 rgba(0,0,0,.14),0 1px 1px 0 rgba(0,0,0,.24)}
  .seal{width:44px;height:44px;border-radius:50%;background:#006241;color:#fff;
    display:grid;place-items:center;margin:0 auto 20px;
    font-family:"Gowun Batang","Batang",serif;font-size:20px;font-weight:700}
  h1{font-size:20px;font-weight:700;color:#006241;letter-spacing:-.02em}
  p{margin-top:12px;font-size:14.5px;color:rgba(0,0,0,.58);word-break:keep-all}
  a.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:24px;
    background:#00754A;color:#fff;border-radius:50px;padding:11px 22px;
    font-size:15px;font-weight:600;text-decoration:none;transition:background .2s ease}
  a.btn:hover{background:#006241}
  a.btn:active{transform:scale(.95)}
</style>
</head>
<body>
  <div class="box">
    <div class="seal">조</div>
    <h1>자리를 옮겼습니다</h1>
    <p>여기 있던 도구들은 그대로 있습니다. 이제 <b>조승재 포트폴리오</b> 한 곳에서 모두 찾으실 수 있습니다.</p>
    <a class="btn" href="https://scienceisjo.github.io/growing-teachers/">포트폴리오로 이동 →</a>
  </div>
  <script>location.replace("https://scienceisjo.github.io/growing-teachers/");</script>
</body>
</html>
