최상위: { "title": "학습지 제목", "design": {...}, "master": {...}, "sections": [...] }
※ id는 쓰지 마라(앱이 만든다). 모르는 필드는 무시된다. 값은 아래 목록에 있는 것만.

■ 글(runs)을 쓰는 법 — 가장 중요
runs·body·prompt·items·choices·표 칸에는 **문자열**을 쓴다. 문자열 안 표기가 서식이 된다:
  **핵심어**        → 굵은 핵심어        예: "빛이 **굴절**하는 까닭"
  {{정답}}         → 학생용에서 빈칸(정답지에 자동 수록)  예: "빛이 꺾이는 현상을 {{굴절}}이라 한다"
  <u>낱말</u>       → 밑줄(옳지 <u>않은</u> 것은?)
런 배열 [{"t":"…","keyTerm":true}] 형태도 받지만, 문자열이 훨씬 안전하다.

■ design (전부 선택)
  themeId: "textbook"(교과서형) | "handwriting"(손글씨) | "pastel" | "infographic" | "workbook"(민트 교재형) | "exam"(수능·문제집형) | "fresh"(활동지) | "bw"(흑백 복사형)
          | "airy"(여백 강조·괘선 없음) | "warmpaper"(미색 종이·명조 제목) | "roundcard"(큰 라운드 카드) | "colorblock"(검은 실선·색면 블록)
          | "crisp"(장식 없이 얇은 괘선) | "orbit"(라벤더 막대·좁은 자간) | "indigo"(인디고 굵은 선·하늘빛 면)
          | "mstripe"(제목 밑 삼색 줄무늬·직각) | "fintech"(파란 짧은 선·표에 강함) | "blueprint"(회백 종이·주황 꺾쇠)
  density: "compact" | "roomy"    textSize: "small" | "large"    orientation: "landscape"(가로)
  qNumStyle: "circle" | "square" | "big" | "paren"(문항 번호 모양)   qBoxed: true(문항 박스)   colRule: true(2단 세로줄)
  blankShape: "box" | "underline" | "paren"(빈칸 모양 통일 — 문서의 모든 빈칸을 한 모양으로)
  accent: "#a5372c"(강조색, 진한 색만)   school: "학교 이름"

■ master
  header: { unit:"단원명", lesson:"차시명", textbookPages:"교과서 쪽수", grade:"2", nameBox:true, sheetNo:"12" }
  footer: { subject:"과학", pageNumber:true }
  표지처럼 머리글을 없애려면 header.enabled:false

■ sections — 구역 배열. 구역 = 열(columns)의 묶음. 열이 2개면 2단 배치가 된다
  { "layout": "1", "columns": [ [블록, 블록, …] ] }             ← 1단
  { "layout": "1:1", "columns": [ [왼쪽 블록들], [오른쪽 블록들] ] }  ← 2단 (2:1, 1:2도 가능)
  { "layout": "1:1:1", "columns": [ […], […], […] ] }            ← 3단
  layout을 빼면 열 개수로 정한다. 열 폭을 세밀히: "colRatio":[1.4,0.6]

■ 블록 종류 (type) — 각 줄이 한 블록의 전체 모양
  {"type":"title","runs":"소제목"}                                   variant:"band"(띠) | "chip"(알약) 선택
  {"type":"paragraph","runs":"본문 문단. **핵심어**와 {{빈칸}} 가능"}
  {"type":"conceptCard","label":"정의","title":"카드 제목","body":"설명","items":[{"term":"작은 개념","desc":"뜻"}]}
  {"type":"callout","kind":"misconception"|"safety"|"link"|"goal","title":"제목","body":"내용"}   ← 주의·안전·연결·목표 상자
  {"type":"answerBox","variant":"lines"|"box","lines":3,"prompt":"물음"}              ← 학생이 답 쓰는 칸(줄 수 9mm씩)
  {"type":"image","caption":"사진 설명","ratio":"4:3"|"1:1"|"16:9"|"original"}       ← 사진 자리(나중에 클릭해 넣음)
  {"type":"table","headerRow":true,"rows":[["물질","상태"],["물","액체"],["산소",{"text":"","studentBlank":true}]]}
        칸은 문자열. 학생이 채울 칸은 {"text":"정답","studentBlank":true}(학생용에서 비워지고 교사용엔 정답)
  {"type":"spacer","heightMm":8}                                      ← 세로 여백
  {"type":"pageBreak"}                                                 ← 여기서 다음 쪽
  {"type":"checklist","variant":"check"|"scale3"|"scale5","items":["항목1","항목2"]}
  {"type":"steps","variant":"list"|"cards","items":["1단계","2단계"],"shuffle":true}    ← 순서 카드. shuffle이면 학생용은 뒤섞여 순서 맞추기 활동
  {"type":"drawGrid","variant":"grid"|"axes"|"frame","heightMm":60,"xLabel":"시간","yLabel":"온도","prompt":"그래프를 그리시오"}
  {"type":"question", … }  ← 아래 참조

■ question(문항) 필드
  qtype: "choice"(객관식) | "short"(단답) | "essay"(서술) | "ox"
  prompt: "지문"   topic: "관련 개념 라벨(학생용에도 인쇄됨 — 정답 단서 금지)"
  choices: ["① 대신 그냥 내용", "…"]  (번호는 앱이 붙인다. 5개 권장)
  boxItems: ["ㄱ. 진술", "ㄴ. 진술", "ㄷ. 진술"]  → [보기] 상자. 그러면 choices는 ["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"]처럼 짧게(한 줄에 나란히 인쇄됨)
  answer: 객관식 "1"~"5" 또는 "①"~"⑤" / ox "O"|"X" / 단답·서술은 모범 답 문자열
  explanation: "해설(교사용에만)"   points: 5   lines: 4(서술형 답 줄 수)
  tag: "important"|"challenge"|"basic"|"new"  (학생용에도 인쇄되는 배지 — 함정은 tag 대신 teacherNote에)
  imagePos: "right"|"left"|"above"|"below"|"bottom"  → 그 문항 전용 그림 자리
  noteBoxes: [{"kind":"concept","lines":3},{"kind":"why","lines":2},{"kind":"retry","lines":2}]  ← 학생 정리 상자(오답노트)

■ 모든 블록에 붙일 수 있는 것
  teacherNote: "교사용에만 인쇄되는 메모"     visibility: "teacherOnly" | "studentOnly"
  align: "center"|"right"   widthPct: 60(폭 %)   fill: "y"|"g"|"p"|"b"(연한 채우기)   box: "line"|"bold"|"dashed"(테두리)
