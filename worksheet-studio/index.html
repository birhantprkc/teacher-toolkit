물질의 상태 변화

- 물질의 세 가지 상태를 구분할 수 있다.
- 상태 변화의 예를 들 수 있다.

물질은 고체, 액체, 기체의 세 가지 상태로 존재한다. 물질을 이루는 {{입자}}의 배열과 운동이 상태를 결정한다.

고체에서 액체로 변하는 현상을 {{융해}}라고 하며, 이때 **온도는 일정하게 유지**된다.

| 상태 | 모양 | 부피 |

| 고체 | 일정 | 일정 |
| 액체 | 변함 | {{일정}} |
