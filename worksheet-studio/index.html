  white-space: pre-wrap;
  white-space: break-spaces;
  -webkit-font-variant-ligatures: none;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0; /* the above doesn't seem to work in Edge */
}

.ProseMirror [contenteditable="false"] {
  white-space: normal;
}

.ProseMirror [contenteditable="false"] [contenteditable="true"] {
  white-space: pre-wrap;
}

.ProseMirror pre {
  white-space: pre-wrap;
}

img.ProseMirror-separator {
  display: inline !important;
  border: none !important;
  margin: 0 !important;
  width: 0 !important;
  height: 0 !important;
}

.ProseMirror-gapcursor {
  display: none;
  pointer-events: none;
  position: absolute;
  margin: 0;
}

.ProseMirror-gapcursor:after {
  content: "";
  display: block;
  position: absolute;
  top: -2px;
  width: 20px;
  border-top: 1px solid black;
  animation: ProseMirror-cursor-blink 1.1s steps(2, start) infinite;
}

@keyframes ProseMirror-cursor-blink {
  to {
    visibility: hidden;
  }
}

.ProseMirror-hideselection *::selection {
  background: transparent;
}

.ProseMirror-hideselection *::-moz-selection {
  background: transparent;
}

.ProseMirror-hideselection * {
  caret-color: transparent;
}

.ProseMirror-focused .ProseMirror-gapcursor {
  display: block;

- 교육과정을 벗어난 내용·대학 수준 용어·검증 안 된 수치는 쓰지 말 것. 다만 요청 주제 자체가 그 학년 범위를 넘으면 주제를 우선하되, 제목 다음 줄에 "[주의] 교과서 범위를 넘는 심화 주제입니다. 선행 개념을 먼저 확인하세요"를 넣고 전제가 되는 선행 개념은 본문 한 문장으로 풀어 줄 것
- 실생활 예는 1개만, 그 개념을 설명하는 문단 안에 둘 것. 교과서에 늘 나오는 예(자전거 발전기, 스웨터와 머리카락)는 피하고 학생이 직접 겪는 장면(교통카드 단말기, 무선 충전 패드, 인덕션)에서 고르되 두 문장 안에 풀 수 있어야 한다
- 오답 선지는 학생이 실제로 하는 오개념으로 쓸 것. 상식만으로 지워지는 선지('무게로 눌러서')와 "모두 옳다/모두 그르다" 같은 무성의한 선지는 쓰지 말 것. ㄱㄴㄷ 조합형은 세 진술을 각각 따져야 답이 나오게 묶을 것(하나만 판별하면 답이 확정되는 구성 금지)
- 표·그림 자료를 낸 문항은 자료의 모든 행이 정답 판단에 쓰여야 한다. 어느 한 행을 지워도 답이 같으면 자료가 장식이므로 다시 쓸 것. 자료 값은 '약함·보통' 대신 측정값(12 mA, 28 mA)으로
