name: Deploy to GitHub Pages

# 정적 파일(이미 빌드된 단일 HTML들)을 그대로 올린다.
# Jekyll을 쓰지 않으므로 문서 안의 {{ }} 같은 표기가 템플릿으로 해석되지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
